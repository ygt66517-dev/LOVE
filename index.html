<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karthika, a question for you</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=Mulish:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#14102b;--plum:#2a2150;--flame:#f2a93b;--glow:#ffd98a;--jasmine:#fbf6ea;--rose:#d4577c;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 100%,var(--plum),var(--night) 70%);color:var(--jasmine);font-family:'Mulish',system-ui,sans-serif;text-align:center;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:48px 22px 64px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(3.4rem,17vw,6.5rem);letter-spacing:.02em;margin:0;line-height:1;animation:rise 2.2s ease both}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.45rem;color:var(--glow);margin:14px 0 40px;animation:rise 2.2s .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lamps{display:flex;justify-content:center;gap:clamp(6px,2.5vw,18px);margin-bottom:26px}
.lamp{all:unset;cursor:pointer;width:clamp(52px,15vw,78px);display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent}
.lamp:focus-visible{outline:2px solid var(--glow);outline-offset:6px;border-radius:12px}
.flame{width:16px;height:30px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:linear-gradient(#fff3c4,var(--flame));margin-bottom:-4px;transform:scale(0);transform-origin:bottom;transition:transform .6s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 14px var(--flame))}
.bowl{width:100%;height:26px;border-radius:4px 4px 50px 50px;background:#8a5a2b;border-top:3px solid #c98b45}
.lamp.on .flame{transform:scale(1);animation:flick 2s infinite ease-in-out}
@keyframes flick{50%{transform:scale(1.08,.94)}}
.reason{min-height:4.6em;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.5rem;line-height:1.35;max-width:30ch;margin:0 auto;color:var(--jasmine)}
.hint{font-size:.95rem;opacity:.7;margin:0 0 22px}
#ask{display:none;margin-top:44px}
#ask.show{display:block;animation:rise 1.8s ease both}
#ask h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-style:italic;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1.15;margin:0 0 30px}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:70px;position:relative}
button.cta{font:600 1.05rem 'Mulish',sans-serif;border:0;border-radius:40px;padding:15px 34px;cursor:pointer}
#yes{background:var(--rose);color:#fff;font-size:1.2rem;padding:17px 44px;box-shadow:0 0 30px rgba(212,87,124,.5);transition:transform .2s}
#yes:hover{transform:scale(1.06)}
#no{background:transparent;color:var(--jasmine);border:1px solid rgba(251,246,234,.4);transition:transform .25s}
#yes:focus-visible,#no:focus-visible{outline:2px solid var(--glow);outline-offset:4px}
#done{display:none;position:fixed;inset:0;z-index:5;background:var(--night);padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);align-items:center;justify-content:center;flex-direction:column}
#done.show{display:flex;animation:rise 1.4s ease both}
#done h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.6rem,12vw,4.6rem);font-weight:500;margin:0 0 14px}
#done p{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.6rem;color:var(--glow);margin:6px 0;max-width:24ch}
.heart{position:fixed;bottom:-30px;z-index:6;pointer-events:none;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Karthika</h1>
  <p class="sub">I made you something. Light the lamps.</p>

  <div class="lamps" id="lamps"></div>
  <p class="hint" id="hint">Tap each lamp, one at a time.</p>
  <div class="reason" id="reason" aria-live="polite"></div>

  <section id="ask">
    <h2>Karthika, will you marry me?</h2>
    <div class="btns" id="btns">
      <button class="cta" id="yes">Yes</button>
      <button class="cta" id="no">Let me think</button>
    </div>
  </section>
</main>

<div id="done" role="status">
  <h2>She said yes.</h2>
  <p>Karthika, you are my home and my light.</p>
  <p>Forever starts today.</p>
</div>

<script>
// Edit these lines to make it yours.
var REASONS = [
  "You make every ordinary day feel like a festival.",
  "Your smile is the first thing I look for in any room.",
  "With you, I am the best version of myself.",
  "You are my calm, my laughter, and my favourite person.",
  "I want every tomorrow to have you in it."
];
var lit = 0, box = document.getElementById('lamps'), reason = document.getElementById('reason');

REASONS.forEach(function(text, i){
  var b = document.createElement('button');
  b.className = 'lamp';
  b.setAttribute('aria-label', 'Light lamp ' + (i + 1));
  b.innerHTML = '<span class="flame"></span><span class="bowl"></span>';
  b.addEventListener('click', function(){
    reason.textContent = text;
    if (!b.classList.contains('on')) {
      b.classList.add('on');
      lit++;
      if (lit === REASONS.length) {
        document.getElementById('hint').style.display = 'none';
        setTimeout(function(){
          var a = document.getElementById('ask');
          a.classList.add('show');
          a.scrollIntoView({behavior:'smooth', block:'center'});
        }, 1800);
      }
    }
  });
  box.appendChild(b);
});

// The "Let me think" button politely dodges.
var no = document.getElementById('no'), btns = document.getElementById('btns');
function dodge(e){
  if (e) e.preventDefault();
  var r = btns.getBoundingClientRect();
  var x = (Math.random() - .5) * Math.min(r.width - 140, 260);
  var y = (Math.random() - .5) * 90;
  no.style.transform = 'translate(' + x + 'px,' + y + 'px)';
}
no.addEventListener('mouseenter', dodge);
no.addEventListener('touchstart', dodge, {passive:false});
no.addEventListener('click', dodge);

document.getElementById('yes').addEventListener('click', function(){
  document.getElementById('done').classList.add('show');
  var n = 0, t = setInterval(function(){
    var h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['\u2764','\uD83E\uDE94','\u2728'][Math.floor(Math.random()*3)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.fontSize = (18 + Math.random()*26) + 'px';
    h.style.animationDuration = (4 + Math.random()*4) + 's';
    document.body.appendChild(h);
    setTimeout(function(){ h.remove(); }, 8500);
    if (++n > 70) clearInterval(t);
  }, 120);
});
</script>
</body>
</html>
